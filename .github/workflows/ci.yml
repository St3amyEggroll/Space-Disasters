name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}

      - name: Install toolchain
        run: tools/setup.sh

      - name: Format, build, type-check, test
        run: tools/check.sh
